# 면취 고리 펼치기(극좌표) — 정상 추가분 분할(company_v2) 입력용
# company_polar_v1.yaml(메인: 5°~260° 4토막 쌓기)과 펼치는 범위·해상도는 같고, 입력 카테고리와 중심·반지름 찾는 방식이 다름
# 실행: python scripts/preprocessing/company/unwrap_dataset.py --config configs/datasets/company_v2_polar.yaml
# 10월 촬영분은 부품 위치·배율(약 9% 작음)이 달라 아래 center_search·radius_from으로 이미지마다 찾는다
# (PATCHCORE_PROGRESS.md I절). 첫 생성본(카메라 평균 방식)은 중심이 틀어져 폐기함
status: proposed

# 입력: prepare_dataset.py로 만든 원본 크기 카테고리 (ROI·정렬 카테고리는 받지 않음)
source:
  root: data/processed/company
  categories: [company_v2_cam1, company_v2_cam2, company_v2_cam12]

# 출력: 같은 폴더에 <카테고리><suffix> 로 생성 (예: company_cam1_polar)
output:
  suffix: _polar

polar:
  # 펼칠 반지름 범위 (부품 외곽선 반지름의 배수)
  # 학습 정상 라벨의 면취 안쪽 경계 = 0.84~0.97배(중앙값 0.91) → 중심 오차 여유를 두고 0.75부터
  # 바깥은 외곽선(1.0)이 보이도록 1.05까지
  inner: 0.75
  outer: 1.05
  # 펼칠 각도 범위 (시작점 기준, 도). 기업 검사 제외 -5°~100°를 뺀 나머지 = 5°~260°
  angle_range: [5, 260]
  # 띠의 세로 칸 수. 0.30배 × 반지름 약 360px ≈ 108 → 원본과 비슷한 해상도
  radial_px: 108
  # 띠를 몇 토막으로 쌓을지. 4토막 → 432 × 432 정사각형 (토막 하나 = 약 64°)
  rows: 4
  # 중심: 이미지 전체에서 부품을 먼저 찾고 정밀 맞춤 (기본 calibrated = 카메라 평균 중심에서 출발)
  center_search: global
  # 반지름: 가운데 구멍 반지름 × 2.027 (기본 camera = 카메라 평균 반지름)
  radius_from: hole
  # 학습 정상 중 시작점 rise가 120 미만이면 학습에서 뺌 (split.csv에서 unused로 바뀜, 검증·테스트는 그대로)
  # 거친 표면은 rise 120 미만에서 반지름을 4~14% 크게 잡음 (PATCHCORE_PROGRESS.md I-6)
  exclude_train_rise_below: 120
