
# 실험 정보
experiment:
  name: company_cam1_roi_partrot_v1

# 사용할 데이터셋 (prepare_company_dataset.py --roi 로 만든 카테고리)
dataset:
  root: data/raw/mvtec_ad
  category: company_cam1_roi

# 부품 원 위치를 가져올 회사 원본 라벨
labels:
  root: data/raw/company

# 생성 데이터 저장 위치
output:
  root: data/processed

# 부품 원 반지름(라벨 기준 원)에 더할 여유 픽셀 (테두리 어두운 링까지 포함)
part_rotation:
  margin: 20

# 정상편차 실험 조건 (부품만 회전, 단위: 도)
variations:
  rotation_part: [-2, 2, -5, 5, -10, 10, -30, 30, -90, 90, 180]
